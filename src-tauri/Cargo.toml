[package]
name = "tpf2-launcher"
version = "1.3.0"
edition = "2021"
description = "TPF2 Multiplayer Launcher"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

# The Linux backend (src/linux.rs): GitHub API and downloads, SHA-256, the
# native release tarball, and the folder dialog.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[profile.release]
strip = true
lto = "thin"
