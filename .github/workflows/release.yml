name: Windows launcher
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Native helper and frontend
        run: |
          npm run native
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Native unit tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-unit.ps1
      - name: Desktop state regression tests
        run: node --test tests/*.test.js
      - name: Rust checks
        working-directory: src-tauri
        run: cargo test --locked
      - name: Signed Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npm run package
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          ./scripts/prepare-release.ps1
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
      - name: Announce on Discord
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: ./scripts/announce-discord.ps1
