name: Windows launcher
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    # the signed Linux AppImage; the Windows job below publishes it with the
    # installer, and latest.json gets its linux-x86_64 entry
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      - name: Install pinned dependencies
        run: npm ci
      - name: Frontend and checks
        run: |
          npm run build
          node --test tests/*.test.js
          (cd src-tauri && cargo test --locked)
      - name: Signed AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
  build:
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Native helper and frontend
        run: |
          npm run native
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Native unit tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-unit.ps1
      - name: Desktop state regression tests
        run: node --test tests/*.test.js
      - name: Rust checks
        working-directory: src-tauri
        run: cargo test --locked
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release-linux
      - name: Signed Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npm run package
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          ./scripts/prepare-release.ps1
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
      - name: Announce on Discord
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: ./scripts/announce-discord.ps1
